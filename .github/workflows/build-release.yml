name: Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        shell: pwsh
        run: dotnet restore X-Charge.csproj

      - name: Publish Framework-Dependent (~24MB)
        shell: pwsh
        run: |
          dotnet publish X-Charge.csproj -c Release -r win-x64 --nologo `
            --self-contained false `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/framework-dependent

      - name: Publish Standalone Self-Contained (~75MB)
        shell: pwsh
        run: |
          dotnet publish X-Charge.csproj -c Release -r win-x64 --nologo `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:EnableCompressionInSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/standalone

      - name: Package Artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path publish/framework-dependent/X-Charge.exe -DestinationPath X-Charge-FrameworkDependent-win-x64.zip -Force
          Compress-Archive -Path publish/standalone/X-Charge.exe -DestinationPath X-Charge-Standalone-win-x64.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X-Charge-Binaries
          path: |
            X-Charge-FrameworkDependent-win-x64.zip
            X-Charge-Standalone-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            X-Charge-FrameworkDependent-win-x64.zip
            X-Charge-Standalone-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
